<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Offline VS Code extension installation using VSIX</title>
  <desc id="desc">Generated workflow showing connected machine, transfer media, air-gapped machine, and install from VSIX.</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
  <rect width="1280" height="760" fill="#10231f"/>
  <text x="640" y="82" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="34" font-weight="800">Installing VS Code Extensions Offline</text>
  <rect x="80" y="150" width="280" height="360" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
  <rect x="500" y="190" width="280" height="280" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <rect x="920" y="150" width="280" height="360" rx="18" fill="#f0fdf4" stroke="#34d399" stroke-width="3"/>
  <text x="220" y="208" text-anchor="middle" fill="#164e63" font-family="Segoe UI, Arial" font-size="24" font-weight="800">Connected PC</text>
  <text x="640" y="248" text-anchor="middle" fill="#7c2d12" font-family="Segoe UI, Arial" font-size="24" font-weight="800">Approved Transfer</text>
  <text x="1060" y="208" text-anchor="middle" fill="#14532d" font-family="Segoe UI, Arial" font-size="24" font-weight="800">Air-gapped PC</text>
  <g font-family="Segoe UI, Arial" font-size="19" fill="#17201c">
    <text x="125" y="280">1. Open marketplace page</text>
    <text x="125" y="330">2. Download extension file</text>
    <text x="125" y="380">3. Verify publisher/name</text>
    <text x="125" y="430">4. Save .vsix file</text>
    <text x="545" y="320">Use lab-approved media</text>
    <text x="545" y="370">Scan/check as instructed</text>
    <text x="960" y="280">Extensions view</text>
    <text x="960" y="330">...</text>
    <text x="960" y="380">Install from VSIX...</text>
    <text x="960" y="430">Select transferred file</text>
  </g>
  <rect x="139" y="548" width="162" height="62" rx="8" fill="#0f172a"/>
  <text x="220" y="587" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="20">python.vsix</text>
  <rect x="978" y="548" width="164" height="62" rx="8" fill="#0f172a"/>
  <text x="1060" y="587" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="20">installed</text>
  <g stroke="#f59e0b" stroke-width="6" marker-end="url(#arrow)">
    <line x1="360" y1="330" x2="500" y2="330"/>
    <line x1="780" y1="330" x2="920" y2="330"/>
  </g>
  <text x="640" y="682" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Do not download directly on restricted machines. Transfer only approved files.</text>
</svg>
