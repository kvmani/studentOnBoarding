<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Paired and unpaired image translation datasets</title>
  <desc id="desc">Pix2pix paired examples and CycleGAN unpaired domains for microscopy image translation.</desc>
  <defs>
    <linearGradient id="a" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="b" x1="0" x2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#071312" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="24" fill="#10231f"/>
  <text x="64" y="84" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">pix2pix vs CycleGAN dataset thinking</text>
  <text x="66" y="124" fill="#d8efe9" font-family="Segoe UI, Arial, sans-serif" font-size="21">Choose the model family from the data you actually have, not from the name that sounds advanced.</text>

  <g transform="translate(70 178)" filter="url(#shadow)">
    <rect width="595" height="500" rx="16" fill="#f8faf9"/>
    <rect width="595" height="78" rx="16" fill="url(#a)"/>
    <text x="34" y="50" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800">pix2pix: paired A to B</text>
    <g transform="translate(46 126)">
      <rect width="170" height="130" rx="10" fill="#cbd5d1"/>
      <path d="M18 106 C52 38 92 88 155 28" stroke="#465954" stroke-width="16" fill="none" opacity=".7"/>
      <rect x="330" width="170" height="130" rx="10" fill="#111827"/>
      <path d="M350 106 C384 38 424 88 485 28" stroke="#78d28a" stroke-width="18" fill="none"/>
      <path d="M226 65 h82" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
      <path d="M308 65 l-16 -12 v24z" fill="#0f766e"/>
      <text x="8" y="178" fill="#17201c" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">same sample, aligned pixels</text>
      <text x="8" y="222" fill="#43544f" font-family="Segoe UI, Arial, sans-serif" font-size="20">Use when each input image has a matching target image.</text>
      <text x="8" y="258" fill="#43544f" font-family="Cascadia Code, Consolas, monospace" font-size="19">dataset/train/*.png  (A|B side by side)</text>
      <text x="8" y="292" fill="#43544f" font-family="Cascadia Code, Consolas, monospace" font-size="19">dataset/val/*.png</text>
    </g>
  </g>

  <g transform="translate(735 178)" filter="url(#shadow)">
    <rect width="595" height="500" rx="16" fill="#f8faf9"/>
    <rect width="595" height="78" rx="16" fill="url(#b)"/>
    <text x="34" y="50" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800">CycleGAN: unpaired domains</text>
    <g transform="translate(46 126)">
      <rect width="150" height="116" rx="10" fill="#cbd5d1"/>
      <circle cx="52" cy="48" r="25" fill="#87958f"/><circle cx="100" cy="68" r="33" fill="#aeb8b4"/>
      <rect x="210" width="150" height="116" rx="10" fill="#dbeafe"/>
      <path d="M226 92 C254 28 310 96 342 28" stroke="#4f46e5" stroke-width="15" fill="none"/>
      <rect x="70" y="170" width="150" height="116" rx="10" fill="#cbd5d1"/>
      <circle cx="122" cy="214" r="29" fill="#7c8984"/><circle cx="174" cy="236" r="26" fill="#b8c0bd"/>
      <rect x="280" y="170" width="150" height="116" rx="10" fill="#dbeafe"/>
      <path d="M296 262 C324 198 380 266 412 198" stroke="#4f46e5" stroke-width="15" fill="none"/>
      <path d="M168 128 C226 84 292 84 350 128" stroke="#b45309" stroke-width="8" fill="none"/>
      <path d="M350 128 l-18 -8 6 20z" fill="#b45309"/>
      <path d="M350 158 C292 206 226 206 168 158" stroke="#b45309" stroke-width="8" fill="none"/>
      <path d="M168 158 l18 -8 -6 20z" fill="#b45309"/>
      <text x="8" y="338" fill="#17201c" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">domains match, images do not</text>
      <text x="8" y="376" fill="#43544f" font-family="Cascadia Code, Consolas, monospace" font-size="19">trainA/, trainB/, testA/, testB/</text>
    </g>
  </g>
</svg>
