<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Paired and unpaired image translation datasets</title>
  <desc id="desc">Comparison of pix2pix paired examples and CycleGAN unpaired horse and zebra domains.</desc>
  <defs>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#071312" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1400" height="760" rx="24" fill="#10231f"/>
  <text x="64" y="82" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">pix2pix vs CycleGAN dataset thinking</text>
  <text x="66" y="124" fill="#d8efe9" font-family="Segoe UI, Arial, sans-serif" font-size="21">pix2pix needs exact pairs. CycleGAN learns between unpaired domains that have recognizable traits.</text>

  <g transform="translate(70 178)" filter="url(#shadow)">
    <rect width="595" height="500" rx="16" fill="#f8faf9"/>
    <rect width="595" height="78" rx="16" fill="url(#teal)"/>
    <text x="34" y="50" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800">pix2pix: paired A to B</text>
    <g transform="translate(46 126)">
      <rect width="170" height="130" rx="10" fill="#d7e2df"/>
      <path d="M18 104 C50 40, 94 86, 154 30" stroke="#64756f" stroke-width="16" fill="none" opacity=".75"/>
      <rect x="330" width="170" height="130" rx="10" fill="#111827"/>
      <path d="M350 104 C382 40, 426 86, 486 30" stroke="#78d28a" stroke-width="18" fill="none"/>
      <path d="M226 65 h82" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
      <path d="M308 65 l-16 -12 v24z" fill="#0f766e"/>
      <text x="8" y="176" fill="#17201c" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">same sample, aligned pixels</text>
      <text x="8" y="218" fill="#43544f" font-family="Segoe UI, Arial, sans-serif" font-size="20">Use when every input image has its matching answer.</text>
      <text x="8" y="258" fill="#43544f" font-family="Cascadia Code, Consolas, monospace" font-size="18">train/*.png  = A and B side by side</text>
      <text x="8" y="292" fill="#43544f" font-family="Cascadia Code, Consolas, monospace" font-size="18">val/*.png    = same paired contract</text>
    </g>
  </g>

  <g transform="translate(735 178)" filter="url(#shadow)">
    <rect width="595" height="500" rx="16" fill="#f8faf9"/>
    <rect width="595" height="78" rx="16" fill="url(#amber)"/>
    <text x="34" y="50" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800">CycleGAN: unpaired domains</text>
    <g transform="translate(42 118)">
      <text x="18" y="24" fill="#134e4a" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Domain A: horses</text>
      <text x="322" y="24" fill="#7f3217" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Domain B: zebras</text>

      <g transform="translate(18 52)">
        <rect width="190" height="116" rx="14" fill="#d9f1dd"/>
        <path d="M28 86 C45 48, 88 42, 126 58 C152 68, 162 84, 154 97 C118 86, 72 86, 28 86 Z" fill="#9b6035"/>
        <path d="M123 57 C137 34, 156 28, 166 38 C158 48, 150 58, 145 75 Z" fill="#8a4f2d"/>
        <circle cx="161" cy="37" r="13" fill="#9b6035"/>
        <path d="M166 25 l11 -18 l3 23" fill="#7a4327"/>
        <path d="M152 25 l-5 -20 l17 12" fill="#7a4327"/>
        <path d="M45 74 C30 70, 22 62, 14 48" stroke="#6f3e23" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M57 85 l-8 37 M84 87 l-1 35 M118 87 l7 35 M142 84 l16 34" stroke="#5b351f" stroke-width="7" stroke-linecap="round"/>
        <path d="M50 58 C72 36, 113 42, 133 57" stroke="#6f3e23" stroke-width="8" fill="none" stroke-linecap="round"/>
        <circle cx="165" cy="36" r="2.8" fill="#111827"/>
      </g>
      <g transform="translate(82 200)">
        <rect width="190" height="116" rx="14" fill="#d9f1dd"/>
        <path d="M30 78 C52 48, 94 43, 131 62 C151 73, 157 91, 146 100 C105 91, 69 91, 30 78 Z" fill="#b87842"/>
        <path d="M130 60 C147 43, 166 40, 174 51 C164 59, 155 68, 151 84 Z" fill="#a56338"/>
        <circle cx="171" cy="49" r="12" fill="#b87842"/>
        <path d="M175 37 l11 -17 l1 22" fill="#7a4327"/>
        <path d="M162 38 l-7 -18 l17 9" fill="#7a4327"/>
        <path d="M50 73 C35 66, 27 53, 22 39" stroke="#7a4327" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M59 84 l-17 32 M88 90 l11 28 M119 91 l-2 31 M143 86 l20 25" stroke="#5b351f" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M54 60 C77 40, 111 46, 137 61" stroke="#7a4327" stroke-width="8" fill="none" stroke-linecap="round"/>
        <circle cx="174" cy="49" r="2.8" fill="#111827"/>
      </g>

      <g transform="translate(322 52)">
        <rect width="190" height="116" rx="14" fill="#e5f3ff"/>
        <path d="M28 84 C48 48, 91 43, 130 59 C153 69, 162 86, 153 98 C114 89, 70 89, 28 84 Z" fill="#f8fafc"/>
        <path d="M127 58 C143 36, 162 30, 171 42 C161 50, 153 62, 149 79 Z" fill="#f8fafc"/>
        <circle cx="166" cy="40" r="13" fill="#f8fafc"/>
        <path d="M171 28 l12 -18 l2 23" fill="#111827"/>
        <path d="M157 29 l-6 -19 l18 11" fill="#111827"/>
        <path d="M47 73 C32 69, 22 59, 15 45" stroke="#111827" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M58 84 l-9 37 M87 88 l-1 34 M119 88 l7 34 M143 84 l17 32" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
        <path d="M51 58 C74 37, 113 42, 136 58" stroke="#111827" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M55 54 l20 31 M78 45 l27 43 M103 45 l26 45 M131 58 l18 37 M151 43 l12 27 M37 72 l17 22" stroke="#111827" stroke-width="6"/>
        <circle cx="169" cy="40" r="2.8" fill="#111827"/>
      </g>
      <g transform="translate(264 200)">
        <rect width="190" height="116" rx="14" fill="#e5f3ff"/>
        <path d="M32 77 C55 50, 93 44, 130 61 C150 70, 158 88, 148 99 C112 93, 72 91, 32 77 Z" fill="#f8fafc"/>
        <path d="M129 60 C146 43, 164 41, 173 52 C163 60, 154 70, 150 84 Z" fill="#f8fafc"/>
        <circle cx="170" cy="50" r="12" fill="#f8fafc"/>
        <path d="M174 38 l11 -17 l1 22" fill="#111827"/>
        <path d="M161 39 l-8 -18 l18 9" fill="#111827"/>
        <path d="M51 72 C38 65, 30 51, 25 38" stroke="#111827" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M61 83 l-17 32 M89 90 l10 29 M119 91 l-2 31 M143 86 l20 25" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M55 61 C78 40, 112 47, 137 62" stroke="#111827" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M55 56 l23 34 M81 47 l29 45 M108 49 l24 44 M134 62 l17 33 M151 47 l13 28 M39 72 l18 23" stroke="#111827" stroke-width="6"/>
        <circle cx="173" cy="50" r="2.8" fill="#111827"/>
      </g>

      <path d="M225 160 C268 122, 314 122, 357 160" stroke="#b45309" stroke-width="9" fill="none"/>
      <path d="M357 160 l-20 -9 l7 22z" fill="#b45309"/>
      <path d="M357 186 C314 226, 268 226, 225 186" stroke="#b45309" stroke-width="9" fill="none"/>
      <path d="M225 186 l20 -9 l-7 22z" fill="#b45309"/>

      <text x="18" y="374" fill="#17201c" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">no matching horse-zebra pairs</text>
      <text x="18" y="410" fill="#43544f" font-family="Segoe UI, Arial, sans-serif" font-size="18">Learns horse shapes, zebra stripes, and style mapping.</text>
    </g>
  </g>
</svg>
