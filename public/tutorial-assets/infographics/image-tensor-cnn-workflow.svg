<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Image tensor and CNN workflow</title>
  <desc id="desc">A microscope image becomes a tensor, passes through convolution filters and feature maps, and becomes a pixel prediction mask.</desc>
  <rect width="1200" height="620" fill="#f8faf9"/>
  <rect x="40" y="40" width="1120" height="540" rx="8" fill="#ffffff" stroke="#d8e2de" stroke-width="3"/>
  <text x="70" y="92" fill="#17201c" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">How a microscope image becomes a deep-learning prediction</text>
  <text x="70" y="130" fill="#587069" font-family="Segoe UI, Arial, sans-serif" font-size="20">The model does not see “a picture.” It sees numbers shaped as batches, channels, height, and width.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    <rect x="82" y="205" width="160" height="145" rx="8" fill="#dbe7e2" stroke="#73827d" stroke-width="3"/>
    <path d="M105 315 C135 235,180 335,225 235" stroke="#5d6b64" stroke-width="13" fill="none" opacity=".8"/>
    <path d="M105 250 C140 220,170 265,225 215" stroke="#17201c" stroke-width="8" fill="none" opacity=".5"/>
    <text x="115" y="386" fill="#17201c" font-size="20">image</text>
    <text x="95" y="414" fill="#587069" font-size="16">H x W pixels</text>

    <rect x="330" y="185" width="180" height="185" rx="8" fill="#ecfeff" stroke="#164e63" stroke-width="3"/>
    <text x="360" y="225" fill="#164e63" font-size="24">tensor</text>
    <text x="355" y="260" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="21">N x C x H x W</text>
    <text x="355" y="296" fill="#43544f" font-size="17">N = batch</text>
    <text x="355" y="323" fill="#43544f" font-size="17">C = channels</text>
    <text x="355" y="350" fill="#43544f" font-size="17">values normalized</text>

    <rect x="602" y="196" width="150" height="160" rx="8" fill="#fff3dd" stroke="#b05c2a" stroke-width="3"/>
    <text x="628" y="235" fill="#7f3217" font-size="24">filters</text>
    <g stroke="#17201c" stroke-width="2">
      <rect x="638" y="266" width="26" height="26" fill="#ffffff"/>
      <rect x="664" y="266" width="26" height="26" fill="#f9d56e"/>
      <rect x="690" y="266" width="26" height="26" fill="#ffffff"/>
      <rect x="638" y="292" width="26" height="26" fill="#f9d56e"/>
      <rect x="664" y="292" width="26" height="26" fill="#b05c2a"/>
      <rect x="690" y="292" width="26" height="26" fill="#f9d56e"/>
      <rect x="638" y="318" width="26" height="26" fill="#ffffff"/>
      <rect x="664" y="318" width="26" height="26" fill="#f9d56e"/>
      <rect x="690" y="318" width="26" height="26" fill="#ffffff"/>
    </g>

    <rect x="840" y="186" width="165" height="178" rx="8" fill="#e5f3f1" stroke="#2f6f73" stroke-width="3"/>
    <text x="862" y="225" fill="#134e4a" font-size="24">feature maps</text>
    <rect x="872" y="255" width="90" height="55" fill="#ffffff" stroke="#2f6f73"/>
    <path d="M882 292 C900 260,925 305,956 265" stroke="#2f6f73" stroke-width="8" fill="none"/>
    <rect x="895" y="286" width="90" height="55" fill="#ffffff" stroke="#2f6f73" opacity=".85"/>
    <path d="M905 323 C923 291,948 336,979 296" stroke="#6956b5" stroke-width="8" fill="none"/>

    <rect x="1052" y="205" width="82" height="145" rx="8" fill="#111827" stroke="#111827" stroke-width="3"/>
    <path d="M1065 315 C1082 235,1102 335,1125 235" stroke="#78d28a" stroke-width="10" fill="none"/>
    <text x="1038" y="386" fill="#17201c" font-size="20">mask</text>
    <text x="1015" y="414" fill="#587069" font-size="16">pixel classes</text>
  </g>

  <g stroke="#2f6f73" stroke-width="5" fill="none">
    <path d="M248 277 H322"/><path d="M516 277 H594"/><path d="M758 277 H832"/><path d="M1012 277 H1045"/>
  </g>
  <g fill="#2f6f73">
    <path d="M322 277 l-14-8 5 8-5 8z"/><path d="M594 277 l-14-8 5 8-5 8z"/>
    <path d="M832 277 l-14-8 5 8-5 8z"/><path d="M1045 277 l-14-8 5 8-5 8z"/>
  </g>

  <rect x="118" y="480" width="965" height="74" rx="8" fill="#111827"/>
  <text x="145" y="512" fill="#d3e6dd" font-family="Consolas, Cascadia Code, monospace" font-size="20">batch.shape = [N, C, H, W]  ->  prediction.shape = [N, classes, H, W]</text>
  <text x="145" y="540" fill="#9fb3ad" font-family="Segoe UI, Arial, sans-serif" font-size="17">For binary hydride segmentation, classes often mean background vs hydride at every pixel.</text>
</svg>
