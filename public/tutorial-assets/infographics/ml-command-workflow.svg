<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Command-line machine learning workflow</title>
  <desc id="desc">Workflow from folder inspection through environment setup, data QA, debug training, full training, inference, and log review.</desc>
  <rect width="1200" height="520" fill="#f8faf9"/>
  <rect x="40" y="40" width="1120" height="440" rx="8" fill="#ffffff" stroke="#d8e2de" stroke-width="3"/>
  <text x="70" y="92" fill="#17201c" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">The command line turns ML into repeatable experiments</text>
  <text x="70" y="130" fill="#587069" font-family="Segoe UI, Arial, sans-serif" font-size="20">Every serious run is just a scriptable chain: inspect, activate, check data, run tiny, run real, inspect artifacts.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="70" y="185" width="150" height="95" rx="8" fill="#e5f3f1" stroke="#2f6f73" stroke-width="3"/>
    <text x="105" y="226" fill="#134e4a">where am I?</text>
    <text x="103" y="255" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="17">pwd / ls</text>
    <rect x="250" y="185" width="150" height="95" rx="8" fill="#ecfeff" stroke="#164e63" stroke-width="3"/>
    <text x="289" y="226" fill="#164e63">activate</text>
    <text x="274" y="255" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="17">.venv</text>
    <rect x="430" y="185" width="150" height="95" rx="8" fill="#fff3dd" stroke="#b05c2a" stroke-width="3"/>
    <text x="462" y="226" fill="#7f3217">data QA</text>
    <text x="450" y="255" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="17">strict checks</text>
    <rect x="610" y="185" width="150" height="95" rx="8" fill="#ece9fb" stroke="#6956b5" stroke-width="3"/>
    <text x="644" y="226" fill="#4c3d8f">debug run</text>
    <text x="635" y="255" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="17">1 epoch</text>
    <rect x="790" y="185" width="150" height="95" rx="8" fill="#e5f3f1" stroke="#2f6f73" stroke-width="3"/>
    <text x="827" y="226" fill="#134e4a">real run</text>
    <text x="816" y="255" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="17">GPU/HPC</text>
    <rect x="970" y="185" width="150" height="95" rx="8" fill="#111827" stroke="#111827" stroke-width="3"/>
    <text x="1013" y="226" fill="#d3e6dd">review</text>
    <text x="992" y="255" fill="#d3e6dd" font-family="Consolas, Cascadia Code, monospace" font-size="17">tail / html</text>
  </g>
  <g stroke="#2f6f73" stroke-width="5" fill="none">
    <path d="M220 232 H248"/><path d="M400 232 H428"/><path d="M580 232 H608"/><path d="M760 232 H788"/><path d="M940 232 H968"/>
  </g>
  <g fill="#2f6f73">
    <path d="M248 232 l-14-8 5 8-5 8z"/><path d="M428 232 l-14-8 5 8-5 8z"/><path d="M608 232 l-14-8 5 8-5 8z"/><path d="M788 232 l-14-8 5 8-5 8z"/><path d="M968 232 l-14-8 5 8-5 8z"/>
  </g>
  <rect x="130" y="340" width="940" height="74" rx="8" fill="#111827"/>
  <text x="158" y="372" fill="#d3e6dd" font-family="Consolas, Cascadia Code, monospace" font-size="18">Get-ChildItem data -Recurse | Select-Object -First 20</text>
  <text x="158" y="400" fill="#9fb3ad" font-family="Segoe UI, Arial, sans-serif" font-size="17">Pro move: inspect file names and folders before spending GPU time.</text>
</svg>
