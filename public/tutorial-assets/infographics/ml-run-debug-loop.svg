<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ML run and debug loop</title>
  <desc id="desc">A practical ML workflow showing data inspection, debug run, training, evaluation, inference, review, and improvement.</desc>
  <rect width="1200" height="620" fill="#f8faf9"/>
  <rect x="40" y="40" width="1120" height="540" rx="8" fill="#ffffff" stroke="#d8e2de" stroke-width="3"/>
  <text x="70" y="92" fill="#17201c" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">The practical ML loop: debug small before training big</text>
  <text x="70" y="130" fill="#587069" font-family="Segoe UI, Arial, sans-serif" font-size="20">Good runs are boring because paths, shapes, logs, and outputs were checked before the GPU job.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="90" y="230" width="132" height="88" rx="8" fill="#e5f3f1" stroke="#2f6f73" stroke-width="3"/>
    <text x="122" y="268" fill="#134e4a">inspect</text>
    <text x="112" y="296" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="16">ls / QA</text>

    <rect x="270" y="180" width="145" height="88" rx="8" fill="#ece9fb" stroke="#6956b5" stroke-width="3"/>
    <text x="303" y="218" fill="#4c3d8f">debug</text>
    <text x="291" y="246" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="16">1 epoch</text>

    <rect x="468" y="230" width="132" height="88" rx="8" fill="#fff3dd" stroke="#b05c2a" stroke-width="3"/>
    <text x="504" y="268" fill="#7f3217">train</text>
    <text x="488" y="296" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="16">loss ↓</text>

    <rect x="650" y="180" width="145" height="88" rx="8" fill="#ecfeff" stroke="#164e63" stroke-width="3"/>
    <text x="686" y="218" fill="#164e63">evaluate</text>
    <text x="679" y="246" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="16">Dice / IoU</text>

    <rect x="850" y="230" width="132" height="88" rx="8" fill="#e5f3f1" stroke="#2f6f73" stroke-width="3"/>
    <text x="889" y="268" fill="#134e4a">infer</text>
    <text x="873" y="296" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="16">predict</text>

    <rect x="1004" y="350" width="132" height="88" rx="8" fill="#111827" stroke="#111827" stroke-width="3"/>
    <text x="1034" y="388" fill="#d3e6dd">review</text>
    <text x="1022" y="416" fill="#9fb3ad" font-family="Consolas, Cascadia Code, monospace" font-size="16">HTML/logs</text>

    <rect x="652" y="420" width="172" height="88" rx="8" fill="#f8f1e8" stroke="#b05c2a" stroke-width="3"/>
    <text x="694" y="458" fill="#7f3217">improve</text>
    <text x="674" y="486" fill="#17201c" font-family="Consolas, Cascadia Code, monospace" font-size="16">data/config</text>
  </g>

  <g stroke="#2f6f73" stroke-width="5" fill="none">
    <path d="M222 270 C245 246,250 230,265 222"/><path d="M415 224 C440 226,450 244,463 270"/>
    <path d="M600 270 C623 246,630 230,645 222"/><path d="M795 224 C820 226,832 244,845 270"/>
    <path d="M982 300 C1038 314,1066 326,1070 344"/><path d="M1000 392 C930 448,875 468,832 466"/>
    <path d="M650 466 C425 500,195 455,150 326"/>
  </g>
  <g fill="#2f6f73">
    <path d="M265 222 l-15-5 7 7-2 9z"/><path d="M463 270 l-14-8 5 8-5 8z"/>
    <path d="M645 222 l-15-5 7 7-2 9z"/><path d="M845 270 l-14-8 5 8-5 8z"/>
    <path d="M1070 344 l-11-11 2 9-8 4z"/><path d="M832 466 l14-8-5 8 5 8z"/>
    <path d="M150 326 l-1 16 10-8 4 14z"/>
  </g>

  <rect x="105" y="515" width="990" height="54" rx="8" fill="#111827"/>
  <text x="130" y="549" fill="#d3e6dd" font-family="Consolas, Cascadia Code, monospace" font-size="18">first failure to read: path error -> shape error -> mask values -> NaN -> GPU memory -> metric drift</text>
</svg>
