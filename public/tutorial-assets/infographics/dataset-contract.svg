<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Segmentation dataset contract</title>
  <desc id="desc">Train validation test split folders with matching images and masks.</desc>
  <defs>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" x2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#071312" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="24" fill="#f2f5f4"/>
  <text x="64" y="80" fill="#17201c" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">The segmentation dataset contract</text>
  <text x="66" y="120" fill="#43544f" font-family="Segoe UI, Arial, sans-serif" font-size="21">Every split has images and masks. Matching filenames keep the training input and answer paired.</text>

  <g transform="translate(70 178)" filter="url(#shadow)">
    <rect width="1260" height="470" rx="16" fill="url(#card)" stroke="#d8e2de"/>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="24" fill="#17201c">
      <text x="42" y="60">&lt;dataset_root&gt;/</text>
      <text x="82" y="112">train/</text><text x="126" y="154">images/sample_001.png</text><text x="126" y="196">masks/sample_001.png</text>
      <text x="82" y="260">val/</text><text x="126" y="302">images/sample_017.png</text><text x="126" y="344">masks/sample_017.png</text>
      <text x="82" y="408">test/</text><text x="126" y="450">images/sample_031.png    masks/sample_031.png</text>
    </g>
    <g transform="translate(750 72)">
      <rect x="0" y="0" width="180" height="132" rx="10" fill="#cbd5d1"/>
      <path d="M14 106 C46 30 88 94 170 24" fill="none" stroke="#4b5d57" stroke-width="15" stroke-linecap="round" opacity=".75"/>
      <rect x="280" y="0" width="180" height="132" rx="10" fill="url(#mask)"/>
      <path d="M298 106 C330 30 372 94 450 24" fill="none" stroke="#78d28a" stroke-width="17" stroke-linecap="round"/>
      <path d="M196 66 h62" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
      <path d="M258 66 l-16 -12 v24z" fill="#0f766e"/>
      <text x="34" y="178" fill="#17201c" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">image</text>
      <text x="324" y="178" fill="#17201c" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">mask</text>
      <text x="22" y="232" fill="#43544f" font-family="Segoe UI, Arial, sans-serif" font-size="19">Same width and height</text>
      <text x="22" y="266" fill="#43544f" font-family="Segoe UI, Arial, sans-serif" font-size="19">Same stem: sample_001</text>
      <text x="22" y="300" fill="#43544f" font-family="Segoe UI, Arial, sans-serif" font-size="19">Class pixels: background=0, hydride=1</text>
    </g>
  </g>
  <rect x="200" y="684" width="1000" height="44" rx="22" fill="#fff8ed" stroke="#dfc8aa"/>
  <text x="270" y="713" fill="#7f3217" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Rule: split first, then augment training only. Validation and test should stay honest.</text>
</svg>
