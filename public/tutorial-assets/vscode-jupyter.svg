<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Jupyter notebooks in VS Code</title>
  <desc id="desc">Generated screenshot-style diagram showing notebook cells, run buttons, kernel selector, output, and markdown notes.</desc>
  <rect width="1280" height="760" fill="#15221e"/>
  <rect x="70" y="50" width="1140" height="650" rx="24" fill="#f8faf9"/>
  <rect x="70" y="50" width="1140" height="54" rx="24" fill="#2d2d30"/>
  <text x="105" y="85" fill="#ffffff" font-family="Segoe UI, Arial" font-size="20">analysis.ipynb</text>
  <rect x="880" y="62" width="250" height="30" rx="8" fill="#e5f3f1"/>
  <text x="1005" y="84" text-anchor="middle" fill="#194f52" font-family="Segoe UI, Arial" font-size="16" font-weight="700">Kernel: .venv Python 3.11</text>
  <rect x="120" y="145" width="1040" height="120" rx="12" fill="#ffffff" stroke="#d8e2de"/>
  <circle cx="152" cy="190" r="18" fill="#2f6f73"/>
  <path d="M148 181 L148 199 L163 190 z" fill="#ffffff"/>
  <text x="190" y="186" fill="#17201c" font-family="Consolas, monospace" font-size="20">from pathlib import Path</text>
  <text x="190" y="224" fill="#17201c" font-family="Consolas, monospace" font-size="20">image_dir = Path("data/train/images")</text>
  <rect x="120" y="295" width="1040" height="145" rx="12" fill="#ffffff" stroke="#d8e2de"/>
  <circle cx="152" cy="350" r="18" fill="#2f6f73"/>
  <path d="M148 341 L148 359 L163 350 z" fill="#ffffff"/>
  <text x="190" y="342" fill="#17201c" font-family="Consolas, monospace" font-size="20">len(list(image_dir.glob("*.png")))</text>
  <rect x="190" y="370" width="220" height="44" rx="8" fill="#eef7f4"/>
  <text x="214" y="399" fill="#194f52" font-family="Consolas, monospace" font-size="20">128</text>
  <rect x="120" y="470" width="1040" height="120" rx="12" fill="#fff8ed" stroke="#dfc8aa"/>
  <text x="150" y="520" fill="#7f3217" font-family="Segoe UI, Arial" font-size="22" font-weight="800">Markdown note</text>
  <text x="150" y="560" fill="#17201c" font-family="Segoe UI, Arial" font-size="20">Record what data you loaded, what command you ran, and what result you observed.</text>
  <g fill="#fffbeb" stroke="#ffb454" stroke-width="3">
    <rect x="835" y="112" width="230" height="44" rx="10"/>
    <rect x="32" y="328" width="162" height="44" rx="10"/>
    <rect x="864" y="616" width="240" height="44" rx="10"/>
  </g>
  <g fill="#4a2f07" font-family="Segoe UI, Arial" font-size="18" font-weight="700">
    <text x="866" y="141">Choose kernel first</text>
    <text x="70" y="357">Run cell</text>
    <text x="896" y="645">Save useful outputs</text>
  </g>
</svg>
