<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Lab onboarding dashboard illustration</title>
  <desc id="desc">Generated illustration of student workstations, local docs, datasets, VS Code and GPU cluster workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f2f2f"/>
      <stop offset="0.55" stop-color="#17433f"/>
      <stop offset="1" stop-color="#6b3f1d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="980" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="816" cy="120" r="88" fill="#f9d56e" opacity="0.2"/>
  <rect x="80" y="90" width="390" height="260" rx="20" fill="#111827" filter="url(#soft)"/>
  <rect x="112" y="126" width="90" height="190" fill="#252526"/>
  <rect x="224" y="126" width="210" height="132" fill="#1e1e1e"/>
  <rect x="224" y="276" width="210" height="40" fill="#0b1220"/>
  <text x="244" y="170" fill="#9cdcfe" font-family="Consolas, monospace" font-size="18">open folder</text>
  <text x="244" y="210" fill="#ce9178" font-family="Consolas, monospace" font-size="18">run notebook</text>
  <text x="244" y="305" fill="#83d6b4" font-family="Consolas, monospace" font-size="15">(.venv) python qa.py</text>
  <rect x="545" y="110" width="310" height="92" rx="16" fill="#ecfeff" opacity="0.96"/>
  <rect x="545" y="242" width="310" height="92" rx="16" fill="#fff7ed" opacity="0.96"/>
  <rect x="545" y="374" width="310" height="92" rx="16" fill="#f0fdf4" opacity="0.96"/>
  <text x="590" y="164" fill="#164e63" font-family="Segoe UI, Arial" font-size="25" font-weight="800">Local docs</text>
  <text x="590" y="296" fill="#7c2d12" font-family="Segoe UI, Arial" font-size="25" font-weight="800">Dataset QA</text>
  <text x="590" y="428" fill="#14532d" font-family="Segoe UI, Arial" font-size="25" font-weight="800">GPU jobs</text>
